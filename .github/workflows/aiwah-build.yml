name: "Aiwah Minutes - Build (Windows + Apple Silicon)"

# Thin caller of upstream's maintained reusable build (build.yml) so upstream
# build fixes reach us on every sync. Unsigned; installers are uploaded as
# workflow artifacts. See AIWAH.md.

on:
  push:
    branches: [main, 'aiwah/**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      # Updater artifacts stay off until the fork has its own updater signing key.
      build-args: "${{ matrix.args }} --config src-tauri/tauri.aiwah-noupdater.conf.json"
      asset-prefix: "aiwah-minutes"
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
